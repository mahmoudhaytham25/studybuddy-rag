[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studybuddy-rag"
version = "0.1.0"
description = "Local-first desktop RAG study assistant — chat with your lecture PDFs and notes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.24",
    "pymupdf4llm>=0.0.17",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "google-genai>=1.9",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]
package = [
    "pyinstaller>=6",
]

[project.scripts]
studybuddy = "studybuddy.app:main"

[tool.setuptools.packages.find]
include = ["studybuddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
