name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The toolcache Python on macOS is built without
      # --enable-loadable-sqlite-extensions, so a bundled app can't load
      # sqlite-vec (Homebrew CPython enables it — same as local builds).
      - name: Install build Python (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 || brew upgrade python@3.12 || true
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv .venv-build
          echo "PYBIN=$PWD/.venv-build/bin/python" >> "$GITHUB_ENV"

      - name: Install
        shell: bash
        run: '"${PYBIN:-python}" -m pip install -e ".[package]"'

      - name: PyInstaller build
        shell: bash
        run: '"${PYBIN:-python}" -m PyInstaller packaging/studybuddy.spec --clean --noconfirm'

      - name: Smoke test the bundled app
        shell: bash
        run: |
          python - <<'EOF'
          import os, subprocess, sys, tempfile
          exe = ("dist/StudyBuddy.app/Contents/MacOS/StudyBuddy"
                 if sys.platform == "darwin" else "dist/StudyBuddy.exe")
          env = dict(os.environ, QT_QPA_PLATFORM="offscreen")
          # Log to a file, not a pipe: the Windows onefile bootloader spawns
          # a child that inherits handles — a pipe would never reach EOF
          # after killing the parent and the step would hang.
          with tempfile.TemporaryFile(mode="w+b") as logf:
              p = subprocess.Popen([exe], env=env,
                                   stdout=logf, stderr=logf)
              try:
                  code = p.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  # still running == the Qt event loop was reached
                  code = 0
                  if sys.platform == "win32":
                      subprocess.run(
                          ["taskkill", "/F", "/T", "/PID", str(p.pid)],
                          capture_output=True)
                  else:
                      p.kill()
              logf.seek(0)
              err = logf.read().decode(errors="replace")
          if code != 0 or any(
              b in err for b in ("Traceback", "ImportError",
                                 "ModuleNotFoundError")
          ):
              print(err)
              sys.exit(1)
          print("smoke test OK")
          EOF

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: >
          hdiutil create -volname StudyBuddy
          -srcfolder dist/StudyBuddy.app
          -ov -format UDZO
          dist/StudyBuddy-macOS.dmg

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -Path dist\StudyBuddy.exe
          -DestinationPath dist\StudyBuddy-windows.zip -Force

      - name: SHA256 checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum StudyBuddy-* > "SHA256SUMS-${{ runner.os }}.txt"
          else
            shasum -a 256 StudyBuddy-* > "SHA256SUMS-${{ runner.os }}.txt"
          fi
          cat "SHA256SUMS-${{ runner.os }}.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # on workflow_dispatch (branch ref) fall back to a snapshot tag
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-build-{0}', github.run_number) }}
          files: |
            dist/StudyBuddy-*.dmg
            dist/StudyBuddy-*.zip
            dist/SHA256SUMS-*.txt
